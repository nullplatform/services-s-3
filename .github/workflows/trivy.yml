name: trivy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    uses: nullplatform/actions-nullplatform/.github/workflows/trivy-tofu-scan.yml@main

  # Scans the built container image (base layers + this repo's additions) and
  # publishes the findings to the repository Security tab. Report-only: the
  # image owner triages there; the build gate stays in the release pipeline.
  image:
    permissions:
      contents: read
      security-events: write
      # docker-security-scan declares actions: read in its own permissions
      # block; a caller granting less fails the run at startup.
      actions: read
    uses: nullplatform/actions-nullplatform/.github/workflows/docker-security-scan.yml@main
    with:
      context: .
      image_name: services-s3
      exit_code: 0
